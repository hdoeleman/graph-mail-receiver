<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Graph Mail Receiver</title>
<style>
  :root {
    --bg: #f5f6f8; --surface: #ffffff; --text: #1d2330; --muted: #667085;
    --border: #dde1e8; --accent: #2563eb; --accent-text: #ffffff; --error: #b42318; --error-bg: #fee4e2;
  }
  :root[data-theme="dark"] {
    --bg: #0f1218; --surface: #181d27; --text: #e6e9ef; --muted: #98a2b3;
    --border: #2a3140; --accent: #5b8def; --accent-text: #0b1020; --error: #fda29b; --error-bg: #3a1a18;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  h1 { font-size: 1.4rem; margin: 0 auto 0 0; }
  .badge { font-size: .75rem; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
  .controls { display: flex; gap: 12px; align-items: center; margin-bottom: 20px; flex-wrap: wrap; }
  button, select { font: inherit; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); padding: 8px 14px; cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
  button:disabled { opacity: .6; cursor: progress; }
  .status { color: var(--muted); font-size: .9rem; }
  .error { background: var(--error-bg); color: var(--error); padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; }
  .mail { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; }
  .meta { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; color: var(--muted); font-size: .85rem; }
  .from { color: var(--text); font-weight: 600; }
  .subject { font-weight: 600; margin: 6px 0; }
  .body { white-space: pre-wrap; word-break: break-word; margin: 0; }
  .empty { color: var(--muted); text-align: center; padding: 32px 0; }
  .modes { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .modes label { padding: 8px 14px; cursor: pointer; background: var(--surface); border-left: 1px solid var(--border); }
  .modes label:first-child { border-left: 0; }
  .modes input { position: absolute; opacity: 0; pointer-events: none; }
  .modes label:has(input:checked) { background: var(--accent); color: var(--accent-text); font-weight: 600; }
  .modes label:has(input:disabled) { color: var(--muted); cursor: not-allowed; opacity: .6; }
  .modes label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: -2px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Graph Mail Receiver</h1>
    <span class="badge" id="mode">mode: …</span>
    <button id="theme" type="button" aria-label="Toggle dark mode">🌙 Dark</button>
  </header>

  <div class="controls">
    <div class="modes" id="modes" role="radiogroup" aria-label="Mail source">
      <label title="Generated emails, Graph is not called"><input type="radio" name="mode" value="demo"> Demo</label>
      <label title="Graph REST API through Spring @HttpExchange"><input type="radio" name="mode" value="rest"> REST</label>
      <label title="Microsoft Graph Java SDK"><input type="radio" name="mode" value="sdk"> SDK</label>
    </div>
    <button id="pull" class="primary" type="button">Pull emails</button>
    <label title="Only mails not retrieved before (Graph delta query); REST and SDK store them"><input type="checkbox" id="onlyNew"> New mails only</label>
    <button id="stored" type="button" title="Mails stored by earlier new-mail pulls">Show stored</button>
    <button id="reset" type="button" title="Forget the delta sync; the next new-mail pull starts a new sync, without storing anything twice">Reset sync</button>
    <label>Count
      <select id="limit">
        <option>5</option><option selected>10</option><option>25</option><option>50</option>
      </select>
    </label>
    <span class="status" id="status" role="status"></span>
  </div>

  <div id="error" class="error" hidden></div>
  <div id="list"><div class="empty">Press “Pull emails” to fetch the latest messages.</div></div>
</main>

<script>
  const $ = id => document.getElementById(id);
  const root = document.documentElement;

  // Theme: a saved choice wins, otherwise follow the OS setting.
  function applyTheme(theme) {
    root.dataset.theme = theme;
    $('theme').textContent = theme === 'dark' ? '☀️ Light' : '🌙 Dark';
  }
  let saved = null;
  try { saved = localStorage.getItem('theme'); } catch (e) { /* storage unavailable */ }
  applyTheme(saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  $('theme').addEventListener('click', () => {
    const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
    applyTheme(next);
    try { localStorage.setItem('theme', next); } catch (e) { /* ignore */ }
  });

  // Modes: the server says which can be used; the choice is sent with each pull and remembered in this browser.
  const modeInputs = () => [...document.querySelectorAll('input[name="mode"]')];
  const selectedMode = () => (modeInputs().find(i => i.checked) || {}).value;
  function showMode(mode) { $('mode').textContent = 'mode: ' + mode; }

  fetch('/api/modes').then(r => r.json()).then(info => {
    let remembered = null;
    try { remembered = localStorage.getItem('mode'); } catch (e) { /* storage unavailable */ }
    const usable = info.modes.filter(m => m.available).map(m => m.mode);
    for (const status of info.modes) {
      const input = modeInputs().find(i => i.value === status.mode);
      if (!input) continue;
      input.disabled = !status.available;
      if (!status.available) input.parentElement.title = 'Not available: ' + status.reason;
    }
    const initial = usable.includes(remembered) ? remembered : info.defaultMode;
    const input = modeInputs().find(i => i.value === initial);
    if (input) input.checked = true;
    showMode(initial);
  }).catch(() => { $('mode').textContent = 'mode: unknown'; });

  for (const input of modeInputs()) {
    input.addEventListener('change', () => {
      showMode(input.value);
      try { localStorage.setItem('mode', input.value); } catch (e) { /* ignore */ }
    });
  }

  function render(emails) {
    const list = $('list');
    list.replaceChildren();
    if (!emails.length) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = 'No emails found.';
      list.append(empty);
      return;
    }
    const fmt = new Intl.DateTimeFormat(undefined, { dateStyle: 'medium', timeStyle: 'short' });
    for (const m of emails) {
      const card = document.createElement('article');
      card.className = 'mail';

      const meta = document.createElement('div');
      meta.className = 'meta';
      const from = document.createElement('span');
      const name = document.createElement('span');
      name.className = 'from';
      name.textContent = m.senderName || m.senderAddress || '(unknown sender)';
      from.append(name);
      if (m.senderName && m.senderAddress) from.append(' <' + m.senderAddress + '>');
      const date = document.createElement('time');
      date.dateTime = m.receivedAt;
      date.textContent = m.receivedAt ? fmt.format(new Date(m.receivedAt)) : '';
      meta.append(from, date);

      const subject = document.createElement('div');
      subject.className = 'subject';
      subject.textContent = m.subject || '(no subject)';

      const body = document.createElement('p');
      body.className = 'body';
      body.textContent = m.body || '';   // textContent: email content is never interpreted as HTML

      card.append(meta, subject, body);
      list.append(card);
    }
  }

  // Runs one API call with the buttons disabled; shows the API's error detail when it fails.
  async function run(busyText, call) {
    const buttons = ['pull', 'stored', 'reset'].map($);
    buttons.forEach(b => b.disabled = true);
    $('error').hidden = true;
    $('status').textContent = busyText;
    try {
      $('status').textContent = await call();
    } catch (e) {
      $('error').textContent = e.message;
      $('error').hidden = false;
      $('status').textContent = '';
    } finally {
      buttons.forEach(b => b.disabled = false);
    }
  }

  async function api(url, options) {
    const res = await fetch(url, options);
    if (!res.ok) {
      let detail = res.status + ' ' + res.statusText;
      try { detail = (await res.json()).detail || detail; } catch (e) { /* not JSON */ }
      throw new Error(detail);
    }
    return res.status === 204 ? null : res.json();
  }

  const at = () => ' at ' + new Date().toLocaleTimeString();

  $('pull').addEventListener('click', () => {
    const mode = selectedMode();
    const params = new URLSearchParams();
    if (mode) params.set('mode', mode);
    if ($('onlyNew').checked) {
      return run('Pulling new mails (' + mode + ')…', async () => {
        const result = await api('/api/emails/new?' + params, { method: 'POST' });
        render(result.emails);
        return result.emails.length + ' new email(s) via ' + mode
          + (result.stored ? ', ' + result.storedTotal + ' stored in total' : ' (demo: not stored)') + at();
      });
    }
    params.set('limit', $('limit').value);
    return run('Pulling (' + mode + ')…', async () => {
      const emails = await api('/api/emails?' + params);
      render(emails);
      return emails.length + ' email(s) via ' + mode + at();
    });
  });

  $('stored').addEventListener('click', () => run('Loading stored mails…', async () => {
    const emails = await api('/api/emails/stored?limit=500');
    render(emails);
    return emails.length + ' stored email(s), newest first' + at();
  }));

  $('reset').addEventListener('click', () => run('Resetting the sync…', async () => {
    await api('/api/sync/reset', { method: 'POST' });
    return 'Sync reset: the next new-mail pull starts a new sync, without storing anything twice' + at();
  }));
</script>
</body>
</html>
